name: Build Trigger APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: |
          mkdir -p /tmp/wrapper-gen
          cd /tmp/wrapper-gen
          echo "rootProject.name = 'wrapper-gen'" > settings.gradle
          gradle wrapper --gradle-version 8.7
          mkdir -p $GITHUB_WORKSPACE/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.jar $GITHUB_WORKSPACE/gradle/wrapper/
          cp gradle/wrapper/gradle-wrapper.properties $GITHUB_WORKSPACE/gradle/wrapper/
          cp gradlew $GITHUB_WORKSPACE/
          cp gradlew.bat $GITHUB_WORKSPACE/ 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all flavor release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: trigger-apks
          path: artifacts/*.apk
          retention-days: 30
